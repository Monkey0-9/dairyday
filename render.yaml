services:
  # Backend Service
  - type: web
    name: dairyday-backend
    runtime: docker
    dockerContext: ./backend
    dockerfile: Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dairyday-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: dairyday-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: BACKEND_CORS_ORIGINS
        value: 'https://dairyday-frontend.onrender.com' # Comma-separated or JSON list
      - key: BASE_URL
        fromService:
          type: web
          name: dairyday-backend
          property: host

  # Frontend Service
  - type: web
    name: dairyday-frontend
    runtime: docker
    dockerContext: ./frontend
    dockerfile: Dockerfile
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: dairyday-backend
          property: host
    autoDeploy: true

  # Worker Service (Celery)
  - type: worker
    name: dairyday-worker
    runtime: docker
    dockerContext: ./backend
    dockerfile: Dockerfile
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info -Q pdf
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dairyday-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: dairyday-redis
          property: connectionString

# Managed Database (PostgreSQL)
databases:
  - name: dairyday-db
    plan: free

# Managed Key-Value Store (Redis)
redis:
  - name: dairyday-redis
    plan: free
    ipAllowList: [] # Only allow internal traffic
